<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>VPSMyth | Login</title>
    <link rel="icon" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage disabled */ }
        })();
    </script>
</head>

<body class="login">
    <main class="login-card">
        <div class="login-header">
            <img src="/assets/logo.png" alt="VPSMyth" class="login-logo">
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to manage your VPS</p>
        </div>

        <div id="error-box" class="error-message" role="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus
                    autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="login-btn">
                <span id="btn-text">Login</span>
                <div class="loading-spinner" id="btn-spinner"></div>
            </button>
        </form>

        <p class="login-footer">Self-hosted control panel</p>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
