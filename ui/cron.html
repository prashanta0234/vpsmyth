<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>VPSMyth | Cron Jobs</title>
    <link rel="icon" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage disabled */ }
        })();
    </script>
</head>

<body class="app">
    <div id="sidebar-root"></div>

    <main>
        <header data-topbar data-title="Cron Jobs" data-meta="Commands, scripts and HTTP requests on a schedule"
            data-user="Prashanta"></header>

        <div class="page-header">
            <div>
                <h1>Cron jobs</h1>
                <p>Schedule recurring work on this host. Every run records its exit code and output.</p>
            </div>
            <button class="btn-primary" id="btn-add-job">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
                Add job
            </button>
        </div>

        <div class="cron-card">
            <div id="jobs-container">
                <p class="jobs-empty">Loading…</p>
            </div>
        </div>
    </main>

    <!-- Add / edit job -->
    <div class="modal-overlay" id="job-modal">
        <div class="modal" style="max-width: 620px;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">Add cron job</h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-error" id="form-error"></div>

                <div class="field">
                    <label for="f-name">Job name</label>
                    <input type="text" id="f-name" placeholder="e.g. Daily backup">
                </div>

                <div class="field">
                    <label for="f-schedule">Schedule</label>
                    <div class="preset-grid" id="preset-grid">
                        <button class="btn-preset" type="button" data-expr="* * * * *">Every minute</button>
                        <button class="btn-preset" type="button" data-expr="*/5 * * * *">Every 5 min</button>
                        <button class="btn-preset" type="button" data-expr="*/15 * * * *">Every 15 min</button>
                        <button class="btn-preset" type="button" data-expr="*/30 * * * *">Every 30 min</button>
                        <button class="btn-preset" type="button" data-expr="0 * * * *">Every hour</button>
                        <button class="btn-preset" type="button" data-expr="0 0 * * *">Daily midnight</button>
                        <button class="btn-preset" type="button" data-expr="0 2 * * *">Daily 2 AM</button>
                        <button class="btn-preset" type="button" data-expr="0 0 * * 0">Weekly (Sun)</button>
                        <button class="btn-preset" type="button" data-expr="0 0 1 * *">Monthly</button>
                    </div>
                    <input type="text" id="f-schedule" placeholder="* * * * *   (min hour day month weekday)"
                        style="margin-top: 10px; font-family: var(--font-mono);">
                    <div class="schedule-preview" id="schedule-preview"></div>
                </div>

                <div class="field">
                    <label>Job type</label>
                    <div class="type-tabs">
                        <button class="tab-btn active" type="button" data-type="command">Command</button>
                        <button class="tab-btn" type="button" data-type="script">Script</button>
                        <button class="tab-btn" type="button" data-type="curl">HTTP / cURL</button>
                    </div>
                </div>

                <!-- Command -->
                <div class="tab-panel active" id="panel-command">
                    <div class="field">
                        <label for="f-command">Shell command</label>
                        <input type="text" id="f-command" placeholder="e.g. docker restart myapp">
                        <div class="field-hint">Runs via <code>sh -c "…"</code> with a 5-minute timeout.</div>
                    </div>
                </div>

                <!-- Script -->
                <div class="tab-panel" id="panel-script">
                    <div class="field">
                        <label for="f-script">Bash script</label>
                        <textarea id="f-script" rows="8"
                            placeholder="#!/bin/bash&#10;echo 'Hello from cron'&#10;# your script here"></textarea>
                        <div class="field-hint">Saved to a temp file and executed with <code>bash</code>.</div>
                    </div>
                </div>

                <!-- cURL -->
                <div class="tab-panel" id="panel-curl">
                    <div class="field-row">
                        <div class="field" style="flex: 0 0 120px;">
                            <label for="f-curl-method">Method</label>
                            <select id="f-curl-method">
                                <option>GET</option>
                                <option>POST</option>
                                <option>PUT</option>
                                <option>PATCH</option>
                                <option>DELETE</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="f-curl-url">URL</label>
                            <input type="text" id="f-curl-url" placeholder="https://example.com/webhook">
                        </div>
                    </div>
                    <div class="field">
                        <label>Headers (optional)</label>
                        <div class="headers-list" id="headers-list"></div>
                        <button class="btn-add-header" id="btn-add-header" type="button">+ Add header</button>
                    </div>
                    <div class="field" id="curl-body-field">
                        <label for="f-curl-body">Body (optional)</label>
                        <textarea id="f-curl-body" rows="4" placeholder='{"key": "value"}'></textarea>
                    </div>
                    <div class="field">
                        <label for="f-curl-status">Expected HTTP status</label>
                        <input type="number" id="f-curl-status" value="200" min="100" max="599" style="width: 110px;">
                        <div class="field-hint">The run is marked failed if the response status differs.</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-cancel" type="button">Cancel</button>
                <button class="btn-primary" id="modal-save" type="button">Save job</button>
            </div>
        </div>
    </div>

    <!-- Run history -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal" style="max-width: 720px;" role="dialog" aria-modal="true" aria-labelledby="history-title">
            <div class="modal-header">
                <h3 id="history-title">Run history</h3>
                <button class="modal-close" id="history-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="history-container">
                    <p class="jobs-empty">Loading…</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="history-dismiss" type="button">Close</button>
            </div>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cron.js"></script>
</body>

</html>
