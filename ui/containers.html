<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>VPSMyth | Docker Containers</title>
    <link rel="icon" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage disabled */ }
        })();
    </script>
</head>

<body class="app">
    <div id="sidebar-root"></div>

    <main>
        <header data-topbar data-title="Docker Containers" data-meta="Every container on the host, VPSMyth-managed or not"
            data-search="Search containers…" data-search-id="container-search" data-user="Prashanta"></header>

        <div class="section-header">
            <h2 class="section-title">Containers</h2>
            <div style="display: flex; gap: 8px;">
                <button class="btn-secondary" id="open-pull-modal">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Pull &amp; run image
                </button>
                <button class="btn-primary" id="refresh-containers">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <div id="containers-list" class="apps-grid">
            <!-- Containers are rendered here by containers.js -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <svg class="empty-state-icon" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                </path>
            </svg>
            <h3 class="empty-state-title">No containers found</h3>
            <p class="empty-state-desc">Nothing is running on the Docker daemon right now. Pull an image to start one.
            </p>
        </div>
    </main>

    <!-- Logs -->
    <div class="modal-overlay" id="logs-modal">
        <div class="modal" style="max-width: 820px;" role="dialog" aria-modal="true" aria-labelledby="logs-modal-title">
            <div class="modal-header">
                <h2 class="modal-title" id="logs-modal-title">Container logs</h2>
                <button class="close-modal" id="close-logs-modal" type="button" aria-label="Close">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="logs-container" id="logs-content">Loading logs…</div>
            </div>
        </div>
    </div>

    <!-- Pull & run -->
    <div class="modal-overlay" id="pull-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pull-modal-title">
            <div class="modal-header">
                <h2 class="modal-title" id="pull-modal-title">Pull &amp; run image</h2>
                <button class="close-modal" id="close-pull-modal" type="button" aria-label="Close">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="pull-form">
                <div class="form-group">
                    <label for="imageName">Image name</label>
                    <input type="text" id="imageName" name="imageName" placeholder="nginx:stable-alpine3.23" required>
                </div>
                <div class="form-group">
                    <label for="containerName">Container name</label>
                    <input type="text" id="containerName" name="containerName" placeholder="my-nginx" required>
                </div>
                <div class="form-group">
                    <label for="port">Host port (optional)</label>
                    <input type="number" id="port" name="port" placeholder="8080">
                </div>
                <div class="form-group">
                    <label for="env">Environment variables (JSON)</label>
                    <textarea id="env" name="env" rows="3" placeholder='{"KEY": "VALUE"}'></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-pull">Cancel</button>
                    <button type="submit" class="btn-primary" id="submit-pull">
                        <span id="pull-btn-text">Pull &amp; run</span>
                        <div class="loading-spinner" id="pull-btn-spinner"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/containers.js"></script>
</body>

</html>
