<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>VPSMyth | Applications</title>
    <link rel="icon" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage disabled */ }
        })();
    </script>
</head>

<body class="app">
    <div id="sidebar-root"></div>

    <main>
        <header data-topbar data-title="Applications" data-meta="Build, run and restart your deployed services"
            data-search="Search applications…" data-user="Prashanta"></header>

        <div class="section-header">
            <h2 class="section-title">Manage applications</h2>
            <button class="btn-primary" id="open-deploy-modal">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
                Deploy new app
            </button>
        </div>

        <div id="apps-list" class="apps-grid">
            <!-- Apps are rendered here by apps.js -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <svg class="empty-state-icon" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                </path>
            </svg>
            <h3 class="empty-state-title">No applications found</h3>
            <p class="empty-state-desc">Nothing is deployed on this host yet. Deploy from a Git repository or a Docker
                image to get started.</p>
        </div>
    </main>

    <!-- Logs -->
    <div class="modal-overlay" id="logs-modal">
        <div class="modal" style="max-width: 820px;" role="dialog" aria-modal="true" aria-labelledby="logs-modal-title">
            <div class="modal-header">
                <h2 class="modal-title" id="logs-modal-title">Application logs</h2>
                <button class="close-modal" id="close-logs-modal" type="button" aria-label="Close">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="logs-container" id="logs-content">Loading logs…</div>
            </div>
        </div>
    </div>

    <!-- Edit environment -->
    <div class="modal-overlay" id="edit-env-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-env-title">
            <div class="modal-header">
                <h2 class="modal-title" id="edit-env-title">Edit environment variables</h2>
                <button class="close-modal" id="close-edit-env-modal" type="button" aria-label="Close">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="edit-env-form">
                <input type="hidden" id="edit-env-app-name" name="appName">
                <div class="form-group">
                    <label for="edit-env-json">Environment variables (JSON)</label>
                    <textarea id="edit-env-json" name="env" rows="10" placeholder='{"KEY": "VALUE"}' required></textarea>
                    <p class="field-hint">The app restarts automatically once the variables are saved.</p>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-edit-env">Cancel</button>
                    <button type="submit" class="btn-primary" id="submit-edit-env">
                        <span id="edit-btn-text">Save changes</span>
                        <div class="loading-spinner" id="edit-btn-spinner"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Deploy application -->
    <div class="modal-overlay" id="deploy-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deploy-modal-title">
            <div class="modal-header">
                <h2 class="modal-title" id="deploy-modal-title">Deploy new application</h2>
                <button class="close-modal" id="close-deploy-modal" type="button" aria-label="Close">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="deploy-form">
                <div class="form-group">
                    <label for="appName">Application name</label>
                    <input type="text" id="appName" name="appName" placeholder="my-awesome-app" required>
                </div>
                <div class="form-group">
                    <label>Deployment source</label>
                    <div class="radio-group" role="radiogroup">
                        <label class="radio-option">
                            <input type="radio" name="deployType" value="git" checked> Git repository
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="deployType" value="image"> Docker image
                        </label>
                    </div>
                </div>
                <div id="git-fields">
                    <div class="form-group">
                        <label for="category">Project category</label>
                        <select id="category" name="category">
                            <option value="" disabled selected>Select category</option>
                            <option value="frontend">Frontend</option>
                            <option value="backend">Backend</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="framework">Framework</label>
                        <select id="framework" name="framework">
                            <option value="" disabled selected>Select framework</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="repoURL">GitHub repository URL</label>
                        <input type="url" id="repoURL" name="repoURL" placeholder="https://github.com/user/repo">
                    </div>
                </div>
                <div id="image-fields" style="display: none;">
                    <div class="form-group">
                        <label for="imageName">Docker image name</label>
                        <input type="text" id="imageName" name="imageName" placeholder="username/repo:tag">
                    </div>
                </div>
                <div class="form-group">
                    <label for="port">Port</label>
                    <input type="number" id="port" name="port" placeholder="3000" required>
                </div>
                <div class="form-group">
                    <label for="env">Environment variables (JSON)</label>
                    <textarea id="env" name="env" rows="3" placeholder='{"KEY": "VALUE"}'></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-deploy">Cancel</button>
                    <button type="submit" class="btn-primary" id="submit-deploy">
                        <span id="btn-text">Deploy app</span>
                        <div class="loading-spinner" id="btn-spinner"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/apps.js"></script>
</body>

</html>
