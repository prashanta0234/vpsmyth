<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>VPSMyth | System Tools</title>
    <link rel="icon" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage disabled */ }
        })();
    </script>
</head>

<body class="app">
    <div id="sidebar-root"></div>

    <main>
        <header data-topbar data-title="System Tools" data-meta="Host runtimes installed outside containers"
            data-search="Search tools…" data-user="Prashanta"></header>

        <div class="page-header">
            <div>
                <h1>System tools</h1>
                <p>Install and check the runtimes VPSMyth uses to build and run your applications.</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-label">Node.js</div>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="node-version">Checking…</div>
                <p class="stat-label" style="margin-top: 8px;">Host system runtime</p>
                <button class="btn-primary" id="install-node-btn" style="margin-top: 18px; width: 100%;">
                    <span id="install-text">Install Node.js 20.x</span>
                    <div class="loading-spinner" id="install-spinner"></div>
                </button>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-label">Docker</div>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="docker-status">Checking…</div>
                <p class="stat-label" style="margin-top: 8px;">Container engine</p>
                <button class="btn-primary" id="install-docker-btn" style="margin-top: 18px; width: 100%;">
                    <span id="install-docker-text">Install Docker</span>
                    <div class="loading-spinner" id="install-docker-spinner"></div>
                </button>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-label">Go</div>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="go-status">Checking…</div>
                <p class="stat-label" style="margin-top: 8px;">Go runtime</p>
                <button class="btn-primary" id="install-go-btn" style="margin-top: 18px; width: 100%;">
                    <span id="install-go-text">Install Go 1.21.x</span>
                    <div class="loading-spinner" id="install-go-spinner"></div>
                </button>
            </div>
        </div>
    </main>

    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/system.js"></script>
</body>

</html>
