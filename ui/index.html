<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>VPSMyth | Dashboard</title>
    <link rel="icon" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        // Applied before first paint so the panel never flashes the wrong theme.
        (function () {
            try {
                var t = localStorage.getItem('theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage disabled */ }
        })();
    </script>
</head>

<body class="app">
    <div id="sidebar-root"></div>

    <main>
        <header data-topbar data-title="Dashboard" data-meta="Host overview · refreshed every 5s"
            data-search="Search apps, logs, or settings…" data-user="Prashanta"></header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">CPU usage</span>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value">0.0%</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Memory</span>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value">0.0 GB</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Active apps</span>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="active-apps-count">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Uptime</span>
                    <div class="stat-icon">
                        <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="stat-value">0d 0h</div>
            </div>
        </div>

        <div class="section-header" id="applications-section">
            <h2 class="section-title">Applications</h2>
            <button class="btn-primary" id="open-deploy-modal">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
                Deploy new app
            </button>
        </div>

        <div id="apps-grid" class="apps-grid">
            <!-- Apps are rendered here by dashboard.js -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <svg class="empty-state-icon" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                </path>
            </svg>
            <h3 class="empty-state-title">No applications yet</h3>
            <p class="empty-state-desc">Connect a GitHub repository and VPSMyth will build, containerise and run it —
                ports are assigned automatically.</p>
            <button class="btn-primary" id="empty-deploy-btn">Connect GitHub repository</button>
        </div>
    </main>

    <!-- Deploy application -->
    <div class="modal-overlay" id="deploy-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deploy-modal-title">
            <div class="modal-header">
                <h2 class="modal-title" id="deploy-modal-title">Deploy new application</h2>
                <button class="close-modal" id="close-modal" type="button" aria-label="Close">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="deploy-form">
                <div class="form-group">
                    <label for="appName">Application name</label>
                    <input type="text" id="appName" name="appName" placeholder="my-awesome-app" required>
                </div>
                <div class="form-group">
                    <label for="category">Project category</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="frontend">Frontend</option>
                        <option value="backend">Backend</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="framework">Framework</label>
                    <select id="framework" name="framework" required>
                        <option value="" disabled selected>Select framework</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="repoURL">GitHub repository URL</label>
                    <input type="url" id="repoURL" name="repoURL" placeholder="https://github.com/user/repo" required>
                </div>
                <div class="form-group">
                    <label for="port">Port</label>
                    <input type="number" id="port" name="port" placeholder="3000" required>
                </div>
                <div class="form-group">
                    <label for="env">Environment variables (JSON)</label>
                    <textarea id="env" name="env" rows="3" placeholder='{"KEY": "VALUE"}'></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-deploy">Cancel</button>
                    <button type="submit" class="btn-primary" id="submit-deploy">
                        <span id="btn-text">Deploy app</span>
                        <div class="loading-spinner" id="btn-spinner"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
